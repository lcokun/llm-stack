[project]
name = "llm-stack-core"
version = "0.1.0"
description = "llm-stack orchestration core: inference, retrieval, prompts."
requires-python = ">=3.13,<3.14"
dependencies = [
  "psycopg[binary,pool]==3.3.6",
  "pydantic-settings==2.15.0",
]


[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pyright==1.1.414",
  "ruff==0.16.10",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_stack_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]